name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gộp việc kiểm tra và ghi file bằng câu lệnh bash tiêu chuẩn để tránh lỗi cú pháp GitHub
      - name: Inject google-services.json
        run: |
          if [ ! -z "$GOOGLE_SERVICES_CONTENT" ]; then
            echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json
          fi
        env:
          GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # Gom hai lệnh debug và release vào cùng 1 step cho gọn code và chạy nhanh hơn
      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      # Chuyển đổi cách check secret qua biến môi trường để sửa dứt điểm lỗi Unrecognized named-value
      - name: Sign Release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: r0adkll/sign-android-release@v1
        env:
          HAS_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # Gộp hai bước upload thành 1 step duy nhất để tối ưu dung lượng file cấu hình
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: app/build/outputs/apk/**/*.apk
