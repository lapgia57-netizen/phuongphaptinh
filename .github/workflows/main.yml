name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài JDK 17 (bắt buộc cho Android Gradle Plugin 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Cài Android SDK cần thiết (build-tools, platform...)
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Cài đặt & cache Gradle (không cần file gradlew trong repo)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      # 5. (Tùy chọn) Tạo app/google-services.json từ GitHub Secret
      #    Settings > Secrets and variables > Actions > New repository secret
      #    Tên: GOOGLE_SERVICES_JSON, giá trị: dán nguyên nội dung file google-services.json thật
      - name: Inject google-services.json từ Secret (nếu có)
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      # 6. Build APK Debug (không cần ký, dùng để test nhanh)
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # 7. Build APK Release (chưa ký, trừ khi có keystore ở bước dưới)
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      # 8. (Tùy chọn) Ký bản release nếu bạn đã cấu hình keystore qua Secrets
      #    Cần các secret: SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD,
      #    SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
      - name: Ký Release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          alias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      # 9. Upload APK Debug để tải về từ tab Actions > workflow run > Artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      # 10. Upload APK Release (đã ký nếu có secret, ngược lại là bản unsigned)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
